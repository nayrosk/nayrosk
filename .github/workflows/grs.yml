name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/render_hud.py]

  
concurrency:
    group: readme-cards-${{ github.ref }}
    cancel-in-progress: true
    
permissions:
    contents: write
    pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment: secrets

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: GPG user IDs
        run: |
          echo "fingerprint: ${{ steps.import-gpg.outputs.fingerprint }}"
          echo "keyid:       ${{ steps.import-gpg.outputs.keyid }}"
          echo "name:        ${{ steps.import-gpg.outputs.name }}"
          echo "email:       ${{ steps.import-gpg.outputs.email }}"

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&border_radius=12&bg_color=090b0f&title_color=ffffff&text_color=cdd6e2&icon_color=ff6b3d&ring_color=ff6b3d
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&border_radius=12&bg_color=090b0f&title_color=ffffff&text_color=cdd6e2&icon_color=ff6b3d&ring_color=ff6b3d
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Render HUD cards
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: python3 scripts/render_hud.py

      - name: Commit files
        run: |
          git config user.email "${{ steps.import-gpg.outputs.email }}"
          git config user.name  "${{ steps.import-gpg.outputs.name }}"
          git add profile/*.svg profile/hud/*.svg
          git diff --cached --quiet || git commit -S -m "Update README cards"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT }}
          branch: ${{ github.ref_name }}
          force: true
