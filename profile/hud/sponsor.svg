<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Sponsor Nayrosk on GitHub Sponsors: github.com/sponsors/nayrosk">
<title>Sponsor Nayrosk on GitHub Sponsors: github.com/sponsors/nayrosk</title>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  .eyebrow{font-size:11px;letter-spacing:.2em;fill:#7c8595}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(var(--h))}}
  .beat{animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.18)}25%{transform:scale(1.08)}}.ring{animation:ring 1.6s ease-out infinite}@keyframes ring{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(1.9);opacity:0}}.ecg{stroke-dasharray:90 900;animation:ecg 3.2s linear infinite}@keyframes ecg{from{stroke-dashoffset:990}to{stroke-dashoffset:0}}.halo{animation:halo 2.4s ease-out infinite}@keyframes halo{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(1.12,1.35);opacity:0}}
</style>
<defs>
  <pattern id="lines-sponsor" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="rgba(255,255,255,.03)"/>
  </pattern>
  <radialGradient id="vig-sponsor" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>
  <linearGradient id="band-sponsor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".035"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip-sponsor"><rect width="1200" height="150" rx="12"/></clipPath>
</defs>
<defs>
  <linearGradient id="fade-sponsor" x1="0" x2="1">
    <stop offset="0" stop-color="#ff4d8d" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ff4d8d" stop-opacity="1"/>
    <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="150" rx="12" fill="#000"/><rect x=".5" y=".5" width="1199" height="149" rx="11.5" fill="#090b0f" stroke="rgba(255,255,255,.14)"/><line x1="12" y1="1.5" x2="1188" y2="1.5" stroke="rgba(255,255,255,.05)"/>
<rect x="1" y="1" width="1198" height="3" rx="1.5" fill="url(#fade-sponsor)" clip-path="url(#clip-sponsor)"/>
<path d="M12 18V12H18" stroke="#7c8595" stroke-width="1" fill="none" opacity=".6"/><path d="M1182 12H1188V18" stroke="#7c8595" stroke-width="1" fill="none" opacity=".6"/><path d="M12 132V138H18" stroke="#7c8595" stroke-width="1" fill="none" opacity=".6"/><path d="M1182 138H1188V132" stroke="#7c8595" stroke-width="1" fill="none" opacity=".6"/>
<g class="beat" style="transform-origin:52px 66px"><path transform="translate(39.0 53.0) scale(1.083)" d="M12 21.4 10.6 20.1C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.6z" fill="#ff4d8d"/></g>
<path transform="translate(39.0 53.0) scale(1.083)" d="M12 21.4 10.6 20.1C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.6z" fill="none" stroke="#ff4d8d" opacity=".35" class="ring" style="transform-origin:52px 66px"/>
<text x="84" y="56" class="eyebrow">// FUNDING · GITHUB SPONSORS</text>
<text x="84" y="84" font-size="22" fill="#fff">github.com/sponsors/nayrosk</text>
<text x="84" y="112" font-size="13" fill="#cdd6e2">Sponsorships keep these tools maintained</text>
<text x="84" y="130" font-size="13" fill="#7c8595">and free for everyone.</text>
<polyline points="500,78 560,78 572,72 584,78 600,78 608,86 618,38 628,100 636,78 656,78 672,68 688,78 750,78 762,72 774,78 790,78 798,86 808,38 818,100 826,78 846,78 862,68 878,78 920,78" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5" stroke-linejoin="round"/>
<polyline class="ecg" points="500,78 560,78 572,72 584,78 600,78 608,86 618,38 628,100 636,78 656,78 672,68 688,78 750,78 762,72 774,78 790,78 798,86 808,38 818,100 826,78 846,78 862,68 878,78 920,78" fill="none" stroke="#ff4d8d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500" y="128" font-size="10" letter-spacing=".16em" fill="#7c8595">UPTIME · POWERED BY SPONSORS</text>
<rect x="976" y="53.0" width="180" height="44" rx="22" fill="#ff4d8d" fill-opacity=".12" stroke="#ff4d8d"/>
<rect class="halo" x="976" y="53.0" width="180" height="44" rx="22" fill="none" stroke="#ff4d8d" style="transform-origin:1066px 75px"/>
<path transform="translate(1002.0 67.0) scale(0.667)" d="M12 21.4 10.6 20.1C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.6z" fill="#ff4d8d"/>
<text x="1028" y="80" font-size="14" font-weight="700" letter-spacing=".2em" fill="#fff">SPONSOR ↗</text>
<g clip-path="url(#clip-sponsor)" pointer-events="none">
  <rect width="1200" height="150" fill="url(#lines-sponsor)"/>
  <rect class="scan" style="--h:210px" width="1200" height="60" fill="url(#band-sponsor)"/>
  <rect width="1200" height="150" fill="url(#vig-sponsor)"/>
</g>
</svg>
