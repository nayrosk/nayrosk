<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="pebblify: Crash-safe LevelDB → PebbleDB migration for Cosmos/CometBFT nodes. Adaptive batching, checkpoint recovery and data verification.">
<title>pebblify: Crash-safe LevelDB → PebbleDB migration for Cosmos/CometBFT nodes. Adaptive batching, checkpoint recovery and data verification.</title>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  .eyebrow{font-size:11px;letter-spacing:.2em;fill:#7c8595}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(var(--h))}}
  
</style>
<defs>
  <pattern id="lines-c1" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="rgba(255,255,255,.03)"/>
  </pattern>
  <radialGradient id="vig-c1" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>
  <linearGradient id="band-c1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".035"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip-c1"><rect width="600" height="230" rx="12"/></clipPath>
</defs>
<rect width="600" height="230" rx="12" fill="#000"/><rect x=".5" y=".5" width="599" height="229" rx="11.5" fill="#090b0f" stroke="rgba(255,255,255,.14)"/><line x1="12" y1="1.5" x2="588" y2="1.5" stroke="rgba(255,255,255,.05)"/>
<rect x="1" y="1" width="598" height="3" rx="1.5" fill="#3fe0ff" clip-path="url(#clip-c1)"/>
<circle class="pulse" cx="32" cy="36" r="3.5" fill="#3fe0ff"/>
<text x="44" y="40" class="eyebrow">02 · GO · COSMOS · DOCKERMINT</text>
<text x="572" y="41" text-anchor="end" font-size="15" fill="#7c8595">↗</text>
<text x="28" y="78" font-size="22" font-weight="700" fill="#fff">pebblify</text>
<text x="28" y="112" font-size="14" fill="#cdd6e2">Crash-safe LevelDB → PebbleDB migration for</text><text x="28" y="134" font-size="14" fill="#cdd6e2">Cosmos/CometBFT nodes. Adaptive batching,</text><text x="28" y="156" font-size="14" fill="#cdd6e2">checkpoint recovery and data verification.</text>
<rect x="28" y="186" width="59" height="22" rx="11" fill="none" stroke="rgba(255,255,255,.14)"/><text x="37" y="201" font-size="10" letter-spacing=".08em" fill="#7c8595">V0.4.3</text><rect x="94.8" y="186" width="100" height="22" rx="11" fill="none" stroke="rgba(255,255,255,.14)"/><text x="103.8" y="201" font-size="10" letter-spacing=".08em" fill="#7c8595">180+ COMMITS</text><rect x="202.39999999999998" y="186" width="66" height="22" rx="11" fill="none" stroke="rgba(255,255,255,.14)"/><text x="211.39999999999998" y="201" font-size="10" letter-spacing=".08em" fill="#7c8595">60+ PRS</text>
<g clip-path="url(#clip-c1)" pointer-events="none">
  <rect width="600" height="230" fill="url(#lines-c1)"/>
  <rect class="scan" style="--h:290px" width="600" height="60" fill="url(#band-c1)"/>
  <rect width="600" height="230" fill="url(#vig-c1)"/>
