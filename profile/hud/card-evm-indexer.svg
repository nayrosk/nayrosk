<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="evm-indexer: Fault-tolerant multi-chain EVM event indexer. WebSocket/HTTP RPC failover, circuit breaker, MongoDB storage, Prometheus metrics.">
<title>evm-indexer: Fault-tolerant multi-chain EVM event indexer. WebSocket/HTTP RPC failover, circuit breaker, MongoDB storage, Prometheus metrics.</title>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
