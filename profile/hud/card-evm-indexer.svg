  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(var(--h))}}
  
</style>
<defs>
  <pattern id="lines-c2" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="rgba(255,255,255,.03)"/>
  </pattern>
  <radialGradient id="vig-c2" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>
  <linearGradient id="band-c2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".035"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip-c2"><rect width="600" height="230" rx="12"/></clipPath>
</defs>
<rect width="600" height="230" rx="12" fill="#000"/><rect x=".5" y=".5" width="599" height="229" rx="11.5" fill="#090b0f" stroke="rgba(255,255,255,.14)"/><line x1="12" y1="1.5" x2="588" y2="1.5" stroke="rgba(255,255,255,.05)"/>
<rect x="1" y="1" width="598" height="3" rx="1.5" fill="#ff6b3d" clip-path="url(#clip-c2)"/>
<circle class="pulse" cx="32" cy="36" r="3.5" fill="#ff6b3d"/>
<text x="44" y="40" class="eyebrow">03 · RUST · EVM · TOKIO</text>
<text x="572" y="41" text-anchor="end" font-size="15" fill="#7c8595">↗</text>
<text x="28" y="78" font-size="22" font-weight="700" fill="#fff">evm-indexer</text>
<text x="28" y="112" font-size="14" fill="#cdd6e2">Fault-tolerant multi-chain EVM event indexer.</text><text x="28" y="134" font-size="14" fill="#cdd6e2">WebSocket/HTTP RPC failover, circuit breaker,</text><text x="28" y="156" font-size="14" fill="#cdd6e2">MongoDB storage, Prometheus metrics.</text>
